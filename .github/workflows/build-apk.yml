name: Build Steel Frontier Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steel-frontier-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare web assets
        run: |
          rm -rf android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/assets/www
          cp index.html android-app/app/src/main/assets/www/index.html
          cp -r PackMusic android-app/app/src/main/assets/www/
          cp -r PackSFXTanks android-app/app/src/main/assets/www/

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/SteelFrontier-debug.apk
          sha256sum dist/SteelFrontier-debug.apk > dist/SHA256SUM.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-frontier-debug-apk
          path: dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o "versionName '[^']*'" android-app/app/build.gradle | cut -d "'" -f 2)
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Steel Frontier $VERSION" --notes "Android APK update for Steel Frontier $VERSION."
          gh release upload "$TAG" dist/SteelFrontier-debug.apk dist/SHA256SUM.txt --clobber
