name: Build Steel Frontier APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "apk/latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apk/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: steel-frontier-debug-keystore-v1

      - name: Ensure debug keystore exists
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Capacitor dependencies
        working-directory: apk
        run: npm install

      - name: Create Android project
        working-directory: apk
        run: npx cap add android

      - name: Build local web bundle
        working-directory: apk
        env:
          SF_BUILD: ${{ github.run_number }}
        run: python3 build_www.py

      - name: Sync Capacitor
        working-directory: apk
        run: npx cap sync android

      - name: Patch Android settings
        working-directory: apk
        run: python3 patch_android.py

      - name: Build debug APK
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p dist
          VERSION=$(python3 - <<'PY'
          import re
          s=open("index.html",encoding="utf-8").read()
          print(re.search(r"const GAME_VERSION='([^']+)'",s).group(1))
          PY
          )
          cp apk/android/app/build/outputs/apk/debug/app-debug.apk "dist/SteelFrontier-$VERSION-debug.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-frontier-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -e
          VERSION=$(python3 - <<'PY'
          import re
          s=open("index.html",encoding="utf-8").read()
          print(re.search(r"const GAME_VERSION='([^']+)'",s).group(1))
          PY
          )
          TAG="apk-v$VERSION"
          FILE="SteelFrontier-$VERSION-debug.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$FILE" --clobber
          else
            gh release create "$TAG" "dist/$FILE" \
              --target "$GITHUB_SHA" \
              --title "Steel Frontier v$VERSION APK" \
              --notes "Automated debug APK build from $GITHUB_SHA."
          fi

          URL="https://github.com/ammambouy-ux/Tank-game/releases/download/$TAG/$FILE"
          python3 - <<PY
          import json, re
          s=open("index.html",encoding="utf-8").read()
          v=re.search(r"const GAME_VERSION='([^']+)'",s).group(1)
          a,b,c=[int(x) for x in v.split('.')]
          data={"version":v,"versionCode":a*1000000+b*1000+c,"build":int("${GITHUB_RUN_NUMBER}"),"apkUrl":"$URL","notes":"Автоматическое обновление Steel Frontier."}
          open("apk/latest.json","w",encoding="utf-8").write(json.dumps(data,ensure_ascii=False,indent=2)+"\\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update APK manifest for $VERSION [skip ci]"
            git push
          fi
