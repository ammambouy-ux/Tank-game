name: Steel Frontier Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare bundled web assets
        run: |
          rm -rf android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/assets/www
          cp index.html android-app/app/src/main/assets/www/index.html
          cp -r PackMusic android-app/app/src/main/assets/
          cp -r PackSFXTanks android-app/app/src/main/assets/

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/SteelFrontier-${GITHUB_SHA::7}.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-frontier-android
          path: dist/*
