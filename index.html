<style>

#ov h1{font-size:min(9vw,16vh)}#ov p{max-width:520px;font-size:16px}.sc{background:#2c3a22;color:var(--fg);font-size:22px;box-shadow:0 5px 0 #000}#mtank{background:radial-gradient(ellipse at 50% 60%,#2c3a2255,transparent 70%);border-radius:10px}

#bs input,#pm input{font-family:system-ui,sans-serif;font-size:15px;padding:8px 10px;background:#2c3a22;color:var(--fg);border:2px solid #4a5c3a;border-radius:4px;min-width:0;flex:1;user-select:text;-webkit-user-select:text}

</style>

function resize(){dpr=Math.min(devicePixelRatio||1,2);SPX=innerWidth;SPY=innerHeight;cv.width=SPX*dpr;cv.height=SPY*dpr;cx.setTransform(dpr,0,0,dpr,0,0);U=24;SU=Math.max(16,Math.min(SPX,SPY)/16);VS=SU/U;SW=SPX/VS;SH=SPY/VS;W=U*80;H=U*44}
resize();addEventListener('resize',resize);

['🔫','Мощный снаряд','+40% урона',p=>p.dmg*=1.4],

['🛡️','Экран','−10% получаемого урона',p=>p.armor=Math.min(.6,p.armor+.1)],
['💥','Фугасы','Урон по площади вокруг попадания',p=>p.splash+=.8],
['💚','Регенерация','+1.5 HP в секунду',p=>p.regen+=1.5],
['🍀','Удача','+3% к шансу баффа',p=>p.luck+=.03],
['📈','Опытный','+25% получаемого опыта',p=>p.xpm*=1.25],

['🐘','Тяжёлая пушка','+80% урона, но −33% скорострельности',p=>{p.dmg*=1.8;p.rate*=1.33}]];
const UN=[1,2,3,4,3,5,4,6,5,10,20,15];

{id:'std',name:'Стандартный',cost:0,c1:'#5f8a3f',c2:'#3d5a27',perk:'Без бонусов',mod:{}},

['Улей','БОСС. Почти не стреляет сам — зато постоянно призывает дронов вокруг себя. Разберитесь с ним быстрее.',40,'—','Очень низкая','#c9a227'],
['Разрушитель','БОСС. Замирает, наводит прицел красной линией и бьёт тараном на бешеной скорости, проламывая стены.',22,'30 (таран)','Рывками','#54504c'],
['Артиллерист','БОСС. Держится на дальней дистанции и закидывает сразу тремя минами по площади.',26,'3×26 по площади','Низкая','#6a7a3a']];

function mkP(tk){const eq=TANKS.find(x=>x.id===tk)||TANKS[0],m=eq.mod,p={id:0,name:'',slot:0,tk:eq.id,c1:eq.c1,c2:eq.c2,x:W/2,y:H/2,a:-Math.PI/2,t:-Math.PI/2,hp:100,max:100,cd:0,r:U*.75,xp:0,lvl:1,need:30,pend:0,dmg:1,rate:.33,spd:1,multi:1,pierce:0,vamp:0,armor:0,regen:0,splash:0,luck:0,xpm:1,bs:1,crit:0,mag:0,frost:0,rev:0,fire:false,ch:false,dead:false};
  if(m.spd)p.spd*=m.spd;if(m.dmg)p.dmg*=m.dmg;if(m.armor)p.armor=Math.min(.6,p.armor+m.armor);if(m.max){p.max+=m.max;p.hp+=m.max}return p}

  if(!u){cb&&cb(false,'Укажи адрес сервера');return}
  let ws;try{ws=new WebSocket(u)}catch(e){cb&&cb(false,'Неверный адрес сервера');return}
  net.ws=ws;net.url=u;net.cbs=[cb];let done=false;
  const fin=(ok,m)=>{if(done)return;done=true;clearTimeout(tm);const c=net.cbs;net.cbs=[];c.forEach(f=>f&&f(ok,m))};
  const tm=setTimeout(()=>{try{ws.close()}catch(e){}fin(false,'Сервер не отвечает. На бесплатном Render он просыпается до минуты — попробуй ещё раз.')},45000);
  ws.onopen=()=>ws.send(JSON.stringify({t:'hello',pn:myName,tk:equip}));
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.t==='hi'){net.id=m.id;net.online=m.online;fin(true)}netMsg(m)};
  ws.onerror=()=>fin(false,'Нет связи с сервером');
  ws.onclose=()=>{fin(false,'Соединение закрыто');if(net.ws===ws){net.ws=null;if(online||net.lobby)netEnded('Соединение с сервером потеряно')}};
}
function netEnded(msg){
  if(state==='over')return;
  net.lobby=null;online=false;role=null;ovl=false;if(P)P.ch=false;net.scr=null;net.fromPause=false;clearInterval(net.iv);lobChip();
  state='menu';$('cd').style.display='none';$('pm').style.display='none';$('bs').style.display='none';
  $('t').innerHTML='СТАЛЬНОЙ<br>РУБЕЖ';$('m').innerHTML=esc(msg);$('cn').style.display='';coinLabel();$('go').textContent='В БОЙ';$('ov').style.display='flex';drawMenuTank();
}
function netErr(msg){
  const e=$('ost');
  if(e&&$('bs').style.display!=='none'){e.style.color='#ff8a6a';e.textContent='⚠ '+msg}
  else if($('pm').style.display==='flex'){$('pmi').textContent='⚠ '+msg;net.fromPause=false}
  else showBanner('⚠',msg);
}
function netMsg(m){
  switch(m.t){
    case 'list':net.lobbies=m.lobbies||[];net.online=m.online;if(net.scr==='list')renderList();break;
    case 'lobby':net.lobby=m;lobChip();
      if(net.scr==='list'||net.scr==='create'||net.scr==='room')roomScreen();
      else if($('pm').style.display==='flex')pmRefresh();
      break;
    case 'err':netErr(m.msg);break;
    case 'start':onStart();break;
    case 'left':
      PL=PL.filter(p=>p.id!==m.id);
      if(net.lobby&&Array.isArray(net.lobby.players)){
        net.lobby.players=net.lobby.players.filter(p=>p.id!==m.id);
      }
      if(P&&P.id!==m.id) PL.forEach((p,i)=>p.slot=i);
      break;
    case 'end':netEnded(m.msg||'Хост вышел из игры');break;
    case 'r':onRelay(m.from,m.d);break;
  }
}
function onStart(){
  const L=net.lobby;if(!L)return;
  $('bs').style.display='none';net.scr=null;clearInterval(net.iv);
  if(L.host===net.id)hostBegin(L.players,net.fromPause&&state==='pause');
  else showBanner('ИГРА НАЧИНАЕТСЯ','Загрузка…');
}
function hostBegin(members,resume){
  if(!resume)start();
  online=true;role='host';P.id=net.id;P.name=myName;PL=[P];
  members.forEach((m,i)=>{if(m.id===net.id)return;const q=mkP(m.tk);q.id=m.id;q.name=m.name;const a=i*1.6+.6;q.x=P.x+Math.cos(a)*U*3;q.y=P.y+Math.sin(a)*U*3;PL.push(q)});
  PL.forEach((p,i)=>p.slot=i);
  state='play';ovl=false;P.ch=false;net.fromPause=false;snapT=0;
  $('pm').style.display='none';$('ov').style.display='none';$('bs').style.display='none';
  relay('all',{k:'init',walls:walls.map(w=>[w.i,w.j,w.st?3:w.hp,w.st?1:0]),pl:PL.map(p=>({id:p.id,name:p.name,tk:p.tk,x:Math.round(p.x),y:Math.round(p.y)})),wave});
  banner('ОНЛАЙН','Игроков: '+PL.length);lobChip();last=performance.now();
}
function onInit(d){
  grid();walls=d.walls.map(a=>({x:GX+a[0]*GG,y:GY+a[1]*GG,w:GG,h:GG,hp:a[3]?1e9:a[2],st:a[3],i:a[0],j:a[1]}));
  PL=d.pl.map((a,i)=>{const p=mkP(a.tk);p.id=a.id;p.name=a.name;p.x=a.x;p.y=a.y;p.tx=a.x;p.ty=a.y;p.slot=i;return p});
  P=PL.find(p=>p.id===net.id);if(!P){netEnded('Не удалось войти в игру');return}
  en=[];bl=[];pt=[];pk=[];zn=[];buffs={};wave=d.wave;score=0;rest=0;shake=0;lastW=0;ovl=false;online=true;role='guest';state='play';net.tp=0;
  $('ov').style.display='none';$('bs').style.display='none';$('pm').style.display='none';$('cd').style.display='none';net.scr=null;
  showBanner('ОНЛАЙН','Игроков: '+PL.length);cam(1);lobChip();last=performance.now();
}
function onRelay(from,d){
  if(!d)return;
  if(role==='host'){
    if(d.k==='pose'){const p=PL.find(q=>q.id===from);if(p){p.x=d.x;p.y=d.y;p.a=d.a;p.t=d.t;p.fire=!!d.f;p.ch=!!d.ch}}
    else if(d.k==='up'){const p=PL.find(q=>q.id===from),u=UP[d.i];if(p&&u)u[3](p)}
  }else if(d.k==='init')onInit(d);
  else if(role==='guest'){
    if(d.k==='snap')applySnap(d);
    else if(d.k==='lvl')P.pend++;
    else if(d.k==='over'){state='over';online=false;role=null;ovl=false;netLeave();setTimeout(()=>endRun(d.sc,d.w),900)}
  }
}
function sendSnap(){
  const q=Math.round,a2=v=>Math.round(v*100)/100,o1=v=>Math.round(v*10)/10;
  relay('all',{k:'snap',w:wave,sc:score|0,rs:rest>0?o1(rest):0,
    pl:PL.map(p=>[p.id,q(p.x),q(p.y),a2(p.a),a2(p.t),q(p.hp),p.max,p.dead?1:0,p.ch?1:0,p.lvl,q(p.xp),p.need,p.fire?1:0]),
    en:en.map(e=>[e.id,e.k,q(e.x),q(e.y),a2(e.a),a2(e.t),o1(e.hp),o1(e.mh),e.s,e.tick==null?-1:a2(e.tick),e.st2||0,a2(e.rdx||0),a2(e.rdy||0)]),
    bl:bl.map(b=>[q(b.x),q(b.y),q(b.vx),q(b.vy),b.own?1:0]),
    zn:zn.map(z=>[q(z.x),q(z.y),q(z.r),a2(z.t),z.m,z.k]),
    pk:pk.map(k=>[q(k.x),q(k.y)]),
    bf:Object.fromEntries(Object.entries(buffs).map(([k,v])=>[k,Math.ceil(v)])),
    wc:wq,fx:fq,bn:bq});
  wq=[];fq=[];bq=[];
}
function applySnap(d){
  wave=d.w;score=d.sc;rest=d.rs;buffs=d.bf||{};
  const ids=new Set((d.pl||[]).map(a=>a[0]));
  PL=PL.filter(p=>ids.has(p.id));
  if(P&&!ids.has(P.id)){netEnded('Соединение с хостом потеряно');return}
  PL.forEach((p,i)=>p.slot=i);
  for(const a of d.pl||[]){const p=PL.find(q=>q.id===a[0]);if(!p)continue;
    const wasD=p.dead;p.hp=a[5];p.max=a[6];p.dead=!!a[7];p.lvl=a[9];p.xp=a[10];p.need=a[11];
    if(p===P){if(wasD&&!p.dead){P.x=a[1];P.y=a[2]}if(!wasD&&p.dead)showBanner('ПОДБИТ','Возрождение в следующей волне')}
    else{p.tx=a[1];p.ty=a[2];p.a=a[3];p.t=a[4];p.fire=!!a[12]}}
  const m=new Map(en.map(e=>[e.id,e]));
  en=d.en.map(a=>{let e=m.get(a[0]);if(!e)e={id:a[0],x:a[2],y:a[3]};
    e.k=a[1];e.tx=a[2];e.ty=a[3];e.a=a[4];e.t=a[5];e.hp=a[6];e.mh=a[7];e.s=a[8];e.tick=a[9]<0?null:a[9];e.st2=a[10];e.rdx=a[11];e.rdy=a[12];e.r=U*.75*e.s;e.c=TCOL[e.k][0];e.d=TCOL[e.k][1];return e});
  bl=d.bl.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3],own:!!a[4]}));
  zn=d.zn.map(a=>({x:a[0],y:a[1],r:a[2],t:a[3],m:a[4],k:a[5]}));
  pk=d.pk.map(a=>({x:a[0],y:a[1]}));
  for(const c of d.wc){const w=walls.find(w=>w.i===c[0]&&w.j===c[1]);if(w)w.hp=c[2]}walls=walls.filter(w=>w.hp>0);
  for(const f of d.fx)applyFx(f);
  for(const b of d.bn)showBanner(b[0],b[1]);
}
function applyFx(f){const x=f[0],y=f[1],c=f[2];
  if(c===1){boom(x,y,30,'#ff8a3a',U*7,.7);boom(x,y,12,'#333',U*4,1)}
  else if(c===2){boom(x,y,40,'#ffb03a',U*10,.8);shake=Math.max(shake,8)}
  else if(c===3)boom(x,y,14,'#a8683a',U*5,.6);
  else if(c===4)boom(x,y,50,'#ff8a3a',U*9,.9)}

// ---------- окна ----------
function modeScreen(){net.scr=null;clearInterval(net.iv);
  $('bs').innerHTML='<h2>РЕЖИМ ИГРЫ</h2><div class="col"><button id="m1">ВОЛНЫ</button><button id="m2" class="sc">ОНЛАЙН</button><button id="m3" class="sc">НАЗАД</button></div>';
  $('bs').style.display='block';$('m1').onclick=start;$('m2').onclick=onlineScreen;$('m3').onclick=()=>$('bs').style.display='none'}
function renderList(){
  const e=$('lbl');if(!e)return;const a=net.lobbies||[];
  e.innerHTML=a.length?a.map(l=>`<div class="lr" data-c="${esc(l.code)}" data-k="${l.lock?1:0}"><b>${esc(l.name)}</b><span>${esc(l.code)} · 👥 ${l.n}/${l.max}${l.lock?' 🔒':''}${l.started?' · в бою':''}</span></div>`).join(''):'<p style="font-family:system-ui,sans-serif;font-size:14px;opacity:.8;margin:0">Лобби пока нет — создай своё.</p>';
  e.querySelectorAll('.lr').forEach(d=>d.onclick=()=>{$('jc').value=d.dataset.c;if(d.dataset.k==='1')$('jp').focus()});
  const s=$('ost');if(s&&!s.style.color)s.textContent='🟢 Онлайн на сервере: '+(net.online||'?');
}
function onlineScreen(){
  net.scr='list';clearInterval(net.iv);
  const needSrv=!/^https?:$/.test(location.protocol)||!!window.claude;
  $('bs').innerHTML=`<h2>ОНЛАЙН</h2><div class="row"><input id="nm" maxlength="14" placeholder="Ваше имя" value="${esc(myName)}">${needSrv?`<input id="sv" placeholder="Сервер (xxx.onrender.com)" value="${esc(srvAddr())}">`:''}</div><p id="ost">Подключение…</p><div id="lbl" class="gr"></div><div class="row"><input id="jc" maxlength="4" placeholder="Код" style="max-width:90px;text-transform:uppercase"><input id="jp" maxlength="16" placeholder="Пароль (если есть)"><button id="jb" class="sm">ПРИСОЕДИНИТЬСЯ</button></div><div class="row"><button id="ob" class="sm sc">НАЗАД</button><button id="oc" class="sm">СОЗДАТЬ ЛОББИ</button></div>`;
  $('bs').style.display='block';
  const save=()=>{myName=($('nm').value.trim()||myName).slice(0,14);try{localStorage.setItem('pn',myName);if($('sv'))localStorage.setItem('srv',$('sv').value.trim())}catch(e){}};
  const status=(t,bad)=>{const e=$('ost');if(e&&net.scr==='list'){e.textContent=t;e.style.color=bad?'#ff8a6a':''}};
  const conn=cb=>{save();
    if(window.claude&&!srvAddr()){status('⚠ Внутри claude.ai онлайн заблокирован. Открой игру по адресу своего сервера (Render) или укажи его выше.',1);return}
    status('Подключение… (бесплатный сервер может просыпаться до минуты)');
    netConnect((ok,m)=>{if(net.scr!=='list')return;if(!ok){status(m,1);return}
      status('🟢 Онлайн на сервере: '+(net.online||'?'));send({t:'list'});clearInterval(net.iv);
      net.iv=setInterval(()=>{if(net.scr!=='list'){clearInterval(net.iv);return}send({t:'list'})},3000);cb&&cb()})};
  $('ob').onclick=()=>{save();modeScreen()};
  $('oc').onclick=()=>conn(createScreen);
  $('jb').onclick=()=>conn(()=>send({t:'join',code:$('jc').value.trim().toUpperCase(),pass:$('jp').value,pn:myName,tk:equip}));
  conn();
}
function createScreen(){
  net.scr='create';clearInterval(net.iv);
  $('bs').innerHTML=`<h2>СОЗДАТЬ ЛОББИ</h2><div class="row"><input id="cn2" maxlength="20" placeholder="Название лобби" value="${esc('Лобби '+myName)}"><input id="cp" maxlength="16" placeholder="Пароль (необязательно)"></div><p id="ost"></p><div class="row"><button id="cb" class="sm sc">НАЗАД</button><button id="cc" class="sm">СОЗДАТЬ</button></div>`;
  $('cb').onclick=onlineScreen;
  $('cc').onclick=()=>send({t:'create',name:$('cn2').value.trim()||'Лобби',pass:$('cp').value,pn:myName,tk:equip});
}
function roomScreen(){
  const L=net.lobby;if(!L)return;const host=L.host===net.id;
  if(net.scr!=='room'){net.scr='room';clearInterval(net.iv);
    $('bs').innerHTML=`<h2>ЛОББИ</h2><p id="rmh" style="margin:2px 0"></p><p id="rmn" style="margin:2px 0;font-family:system-ui,sans-serif;font-size:14px"></p><div id="rml" class="gr"></div><p id="ost"></p><div class="row"><button id="rx" class="sm sc">ВЫЙТИ</button><button id="rs2" class="sm">НАЧАТЬ</button></div>`;
    $('bs').style.display='block';
    $('rx').onclick=()=>{netLeave();onlineScreen()};
    $('rs2').onclick=()=>send({t:'start'});
  }
  $('rmh').innerHTML=`<b>${esc(L.name)}</b> · Код: <b style="color:var(--acc);font-size:1.5em;letter-spacing:3px">${esc(L.code)}</b>${L.lock?' 🔒':''}`;
  $('rmn').textContent=`Игроков: ${L.players.length}/${L.max} (минимум ${L.min})`+(host?'':' · ждём, пока хост начнёт игру');
  $('rml').innerHTML=L.players.map(p=>`<div class="lr" style="cursor:default"><b>${esc(p.name)}</b><span>${p.id===L.host?'👑 хост':'игрок'}${p.id===net.id?' (вы)':''}</span></div>`).join('');
  const b=$('rs2');b.style.display=host?'':'none';b.disabled=L.players.length<L.min;
}
$('pmo').onclick=()=>{
  if(state!=='pause')return;
  if(!wsUrl(srvAddr())){$('pmi').textContent='Адрес сервера не задан. Открой: МЕНЮ → В БОЙ → ОНЛАЙН и укажи его.';return}
  net.fromPause=true;$('pmi').textContent='Подключение…';
  netConnect((ok,m)=>{if(!ok){net.fromPause=false;$('pmi').textContent='⚠ '+m;return}send({t:'create',name:'Забег '+myName,pass:$('pmpw').value,pn:myName,tk:equip})});
};
$('pms').onclick=()=>send({t:'start'});
$('pmc').onclick=()=>{netLeave();net.fromPause=false;pmRefresh()};
requestAnimationFrame(t=>{last=t;loop(t)});
drawMenuTank();
</script>
