<style>

#cd{flex-direction:row;flex-wrap:wrap;align-content:center}#cd h2,#cd p{width:100%;text-align:center}#cd .cr{width:min(29vw,250px)}

#pm h2{margin:0 0 4px;font-size:clamp(30px,10vh,54px);font-weight:400;color:var(--acc);text-shadow:3px 3px 0 #000}
#pm button{min-width:min(60vw,260px);font-size:clamp(16px,5vh,24px);padding:clamp(8px,2.4vh,14px) 24px}

#pm{gap:clamp(6px,1.6vh,12px)}

#bs .row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;align-items:center}

#pm input{flex:none;width:min(60vw,260px)}
button.sm{font-size:15px;padding:9px 16px;box-shadow:0 3px 0 #7a5a10}

#ost{font-family:system-ui,sans-serif;font-size:14px;margin:4px 0}
#rv{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,18px);background:rgba(10,14,8,.92);text-align:center;padding:16px}
#rv h2{margin:0;font-size:clamp(34px,11vh,60px);font-weight:400;color:var(--bad);text-shadow:3px 3px 0 #000}
#rv .sub{font-family:system-ui,sans-serif;font-size:clamp(12px,3.4vh,16px);max-width:min(90vw,460px);opacity:.95}
#rv .sub b{color:var(--acc)}

#rv .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#rv button{font-size:clamp(14px,4.2vh,22px);padding:clamp(8px,2.2vh,14px) clamp(16px,4vw,32px);min-width:min(40vw,220px)}

#rv .timer{position:relative;width:clamp(56px,15vh,92px);height:clamp(56px,15vh,92px)}

#rv .timer .bg{fill:none;stroke:#0008;stroke-width:7}
#rv .timer .fg{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .95s linear}
#rv .timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vh,34px);color:var(--acc)}
#rv .hint{font-family:system-ui,sans-serif;font-size:clamp(11px,2.6vh,13px);opacity:.6}
#rv .credits{font-family:system-ui,sans-serif;font-size:clamp(12px,3vh,15px);opacity:.85}
</style>

<body>
<canvas id="c"></canvas>
<div id="hud"><span id="wv">ВОЛНА 1</span><div id="hp"><div id="hpf"></div></div><span id="sc">0</span><button id="pb" aria-label="Пауза"><i></i><i></i></button></div>
<div id="hud2"><span id="lv">УР. 1</span><div id="xp"><div id="xpf"></div></div><span id="hon"></span><span id="lob"></span></div><div id="bfbox"><div id="bft">▾</div><div id="bfl"></div></div><div id="rs"></div><div id="rot"><div style="font-size:64px">📱</div>Поверни телефон<br>горизонтально</div><div id="ld"><div class="box"><b id="ldt">Загрузка…</b><span>•••</span></div></div><div id="bn"></div><div id="cd"></div><div id="pm"><h2>ПАУЗА</h2><p id="pmi" style="margin:0;font-family:system-ui,sans-serif;font-size:14px;max-width:min(80vw,420px)"></p><button id="pr">ВЕРНУТЬСЯ</button><input id="pmpw" maxlength="16" placeholder="Пароль для онлайна (необязательно)"><button id="pmo" class="sc">ОТКРЫТЬ ОНЛАЙН</button><button id="pms" style="display:none">НАЧАТЬ</button><button id="pmc" class="sc" style="display:none">ЗАКРЫТЬ ОНЛАЙН</button><button id="pmn" class="sc">МЕНЮ</button></div><div id="ov"><div id="ovi"><div class="mc"><h1 id="t">СТАЛЬНОЙ<br>РУБЕЖ</h1><canvas id="mtank" width="150" height="90"></canvas></div><div class="mc"><p id="m">Левый палец — ехать.<br>Правый палец — целиться и стрелять.<br>Подбирай ремкомплекты «+».</p><p id="cn" style="font-family:system-ui,sans-serif;font-size:14px;opacity:.85;margin:0"></p><p id="on" style="font-family:system-ui,sans-serif;font-size:14px;opacity:.9;margin:0">⚪ Онлайн: …</p><p id="ver" style="font-family:system-ui,sans-serif;font-size:12px;opacity:.6;margin:0"></p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button id="snd" class="sc" style="font-size:12px;padding:5px 12px">🔊 ЗВУК</button><button id="lang" class="sc" style="font-size:12px;padding:5px 10px">RU</button><button id="adm" class="sc" style="font-size:12px;padding:5px 10px">АДМИН</button></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button id="go">В БОЙ</button><button id="bb" class="sc">ВРАГИ</button><button id="gg" class="sc">ГАРАЖ</button></div></div></div></div>
<div id="rv"><h2 id="rvh">ПОДБИТ</h2><div class="sub" id="rvs"></div><div class="timer"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="rvf" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg><div class="num" id="rvn">30</div></div><div class="reward" id="rvr"></div><div class="btns"><button id="rvad">🎬 СМОТРЕТЬ РЕКЛАМУ</button><button id="rvcoin" class="plain">ПРОДОЛЖИТЬ ЗА <span id="rvc">300</span>💰</button></div><div class="btns alt"><button id="rvend" class="plain">ЗАВЕРШИТЬ</button></div><div class="hint" id="rve"></div><div id="rva" style="display:none">⏳</div><div class="hint" id="rvh2"></div></div><div id="bs"></div><script>
const GAME_VERSION='1.4.7';
const ONLINE_SERVER='steel-frontier.onrender.com';
const CG={sdk:null,env:'disabled',ready:false,mute:false,adblock:false,on:false,instant:false,inviteRoom:'',invitePass:'',joinListener:null,flowStarted:false};
const SAVE_KEYS=['tb','tc','to','te','snd','lang','pn','srv'];
const SAVE={tb:'0',tc:'0',to:'["std"]',te:'std',snd:'1',lang:'',pn:'',srv:''};
let saveReady=false,saveReadyResolve;
const saveReadyPromise=new Promise(r=>{saveReadyResolve=r});
function safeLocalGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeLocalSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function safeLocalRemove(k){try{localStorage.removeItem(k)}catch(e){}}
function dataApi(){return CG.on&&CG.ready&&CG.sdk&&CG.sdk.data&&typeof CG.sdk.data.getItem==='function' ? CG.sdk.data : null}
function persistGet(k,fallback=''){
  if(dataApi()){
    try{const v=CG.sdk.data.getItem(k);return v==null?fallback:String(v)}catch(e){return fallback}
  }
  const v=safeLocalGet(k);return v==null?fallback:v;
}
function persistSet(k,v){
  SAVE[k]=String(v);
  const d=dataApi();
  if(d){try{d.setItem(k,String(v));return}catch(e){}}
  safeLocalSet(k,v);
}
function persistRemove(k){delete SAVE[k];const d=dataApi();if(d){try{d.removeItem(k);return}catch(e){}}safeLocalRemove(k)}
function readLocalSnapshot(){for(const k of SAVE_KEYS){const v=safeLocalGet(k);if(v!=null)SAVE[k]=v}}
function applySaveState(){
  try{best=+(SAVE.tb||'0')||0}catch(e){}
  try{coins=+(SAVE.tc||'0')||0}catch(e){}
  try{owned=JSON.parse(SAVE.to||'["std"]');if(!Array.isArray(owned))owned=['std'];if(!owned.includes('std'))owned.unshift('std')}catch(e){owned=['std']}
  equip=SAVE.te||'std';if(!TANKS.some(t=>t.id===equip))equip='std';
  sndOn=SAVE.snd!=='0';
  myName=String(SAVE.pn||'').trim().slice(0,14)||('Player'+(100+R()*900|0));
  if(!SAVE.pn)persistSet('pn',myName);
}
function defaultLocaleFromSdk(){
  const loc=String(CG.sdk?.user?.systemInfo?.locale||navigator.language||'en').toLowerCase();
  return loc.startsWith('ru')?'ru':'en';
}
async function initPersistence(){
  readLocalSnapshot();
  if(CG.on&&dataApi()){
    for(const k of SAVE_KEYS){
      try{
        const remote=CG.sdk.data.getItem(k);
        if(remote!=null){SAVE[k]=String(remote)}
        else if(SAVE[k]!=null && SAVE[k]!==''){CG.sdk.data.setItem(k,String(SAVE[k]))}
      }catch(e){}
    }
    if(!SAVE.lang) SAVE.lang=defaultLocaleFromSdk();
    for(const k of ['tb','tc','to','te','snd','pn','lang']) if(SAVE[k]!=null) {try{CG.sdk.data.setItem(k,String(SAVE[k]))}catch(e){}}
    for(const k of SAVE_KEYS) safeLocalRemove(k);
  } else {
    if(!SAVE.lang) SAVE.lang=defaultLocaleFromSdk();
    if(!SAVE.pn)SAVE.pn='Player'+(100+R()*900|0);
    for(const k of ['lang','pn']) if(SAVE[k]) safeLocalSet(k,SAVE[k]);
  }
  applySaveState();
  LANG=SAVE.lang==='ru'?'ru':'en';
  saveReady=true;if(saveReadyResolve)saveReadyResolve();
  applyLocale();applyGate();coinLabel();sndLabel();
}
async function cgInit(){
  const started=Date.now();
  const isCG=(function(){try{return location.hostname.includes('crazygames')||/crazygames/i.test(document.referrer||'')}catch(e){return false}})();
  const maxWait=isCG?10000:2500;
  while(!(window.CrazyGames&&window.CrazyGames.SDK) && Date.now()-started<maxWait) await new Promise(r=>setTimeout(r,150));
  if(!(window.CrazyGames&&window.CrazyGames.SDK)){
    CG.ready=false;CG.on=false;await initPersistence();return;
  }
  const S=window.CrazyGames.SDK;
  try{await S.init()}catch(e){}
  try{
    CG.sdk=S;CG.ready=true;CG.env=S.environment||'disabled';CG.on=CG.env==='crazygames';
    cgLoading(1);
    try{CG.mute=!!(S.game&&S.game.settings&&S.game.settings.muteAudio)}catch(e){}
    try{S.game.addSettingsChangeListener(s=>{CG.mute=!!s.muteAudio;applyGate()})}catch(e){}
    try{if(S.ad&&S.ad.hasAdblock)CG.adblock=!!(await S.ad.hasAdblock())}catch(e){}
    if(CG.on&&S.game){
      try{CG.instant=!!S.game.isInstantMultiplayer}catch(e){CG.instant=false}
      try{
        const ip=S.game.inviteParams||{};
        const get=S.game.getInviteParam?.bind(S.game);
        CG.inviteRoom=String(ip.roomCode||ip.roomId||get?.('roomCode')||get?.('roomId')||'').trim().toUpperCase();
        CG.invitePass=String(ip.pass||ip.password||get?.('pass')||'').trim();
      }catch(e){}
      try{
        CG.joinListener=params=>{
          const p=params||{};
          const code=String(p.roomCode||p.roomId||p.code||'').trim().toUpperCase();
          const pass=String(p.pass||p.password||'').trim();
          if(code)cgHandleInvite(code,pass);
        };
        S.game.addJoinRoomListener?.(CG.joinListener);
      }catch(e){}
    }
  }catch(e){}
  await initPersistence();
  if(CG.on&&!CG.flowStarted){
    CG.flowStarted=true;
    setTimeout(cgStartFlow,120);
  }

function ghostStep(b,dt){
  b.l-=dt;
  if(b.hid)return;
  if(b.l<=0||b.x<0||b.x>W||b.y<0||b.y>H){b.hid=1;return}
  const ox=b.x-b.vx*dt,oy=b.y-b.vy*dt;
  for(const w of walls)if(w.hp>0&&b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h){
    if(b.ric>0){
      b.ric--;
      const left=ox<=w.x&&ox>=w.x-U*2&&b.x>=w.x;
      const right=ox>=w.x+w.w&&ox<=w.x+w.w+U*2&&b.x<=w.x+w.w;
      const top=oy<=w.y&&oy>=w.y-U*2&&b.y>=w.y;
      const bottom=oy>=w.y+w.h&&oy<=w.y+w.h+U*2&&b.y<=w.y+w.h;
      let fx=left||right,fy=top||bottom;
      if(!fx&&!fy){
        const dx=Math.min(Math.abs(b.x-w.x),Math.abs(b.x-(w.x+w.w)));
        const dy=Math.min(Math.abs(b.y-w.y),Math.abs(b.y-(w.y+w.h)));
        if(dx<dy)fx=true;else fy=true;
      }
      if(fx)b.vx=-b.vx;
      if(fy)b.vy=-b.vy;
      b.x=ox;b.y=oy;
      if(left)b.x=w.x-1;if(right)b.x=w.x+w.w+1;
      if(top)b.y=w.y-1;if(bottom)b.y=w.y+w.h+1;
      boom(b.x,b.y,8,'#ffd76a',U*3.5,.35);
      return;
    }
    b.hid=1;boom(b.x,b.y,6,'#c9884f',U*4,.4);return;
  }
  if(!b.pc)for(const e of en)if(!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+3){
    b.hid=1;boom(b.x,b.y,5,'#fff',U*4,.3);return;

}

// Лимит скорострельности guest на host: токен-бакет (в выстрелах), а не «cd<=0 в момент прихода пакета» —
// иначе сетевой jitter сдвигает интервалы между пакетами и честные выстрелы отбрасываются.
// Средняя скорость ограничена так же, как раньше (1 выстрел за p.rate), но допускается всплеск до SHOT_BURST.
const SHOT_BURST=3;
function takeShot(p){
  const now=performance.now()/1000,iv=p.rate/(buffs.rate?1.6:1);
  p.tok=Math.min(SHOT_BURST,p.tok+(p.tokT?(now-p.tokT)/iv:0));p.tokT=now;
  if(p.tok<1)return false;
  p.tok--;return true;
}
function onRelay(from,d){
  if(!d)return;
  if(role==='host'){
    if(d.k==='pose'){const p=PL.find(q=>q.id===from);if(p){p.x=d.x;p.y=d.y;p.a=d.a;p.t=d.t;p.fire=!!d.f;p.ch=!!d.ch}}
    else if(d.k==='shot'){
      const p=PL.find(q=>q.id===from),a=Number(d.t),s=d.s|0;
      if(p&&s>0){
        // Новый протокол: s — номер выстрела guest. Повтор/старый номер игнорируется (один выстрел — один спавн).
        // ACK ставится и для отклонённых выстрелов: guest по ACK убирает ghost, которому не нашлось пули.
        if(s<=p.ackSeq)return;
        p.ackSeq=s;
        if(Number.isFinite(a)&&state==='play'&&!p.dead&&!p.ch&&p.stun<=0&&takeShot(p)){
          p.t=a;
          const x=Number(d.x),y=Number(d.y);
          if(Number.isFinite(x)&&Number.isFinite(y)&&Math.hypot(x-p.x,y-p.y)<U*8){p.x=x;p.y=y}
          const n=p.multi+(buffs.multi?2:0);
          for(let i=0;i<n;i++)shoot(p,1,U*17*p.bs,p.dmg*(buffs.dmg?2:1),0,(i-(n-1)/2)*U*.22,s*64+i);
        }
      }else if(p&&d.s==null&&Number.isFinite(a)&&state==='play'&&!p.dead&&!p.ch&&p.stun<=0&&p.cd<=0){
        // Старый клиент (1.4.6 и ниже) без seq: прежнее поведение.
        p.t=a;
        const n=p.multi+(buffs.multi?2:0);
        for(let i=0;i<n;i++)shoot(p,1,U*17*p.bs,p.dmg*(buffs.dmg?2:1),0,(i-(n-1)/2)*U*.22);
        p.cd=p.rate/(buffs.rate?1.6:1);
      }
    }
    else if(d.k==='up'){const p=PL.find(q=>q.id===from),u=UP[d.i];if(p&&u){u[3](p,d.r|0);p.ch=false}}
    else if(d.k==='revive'){applyRevive(from,!!d.ad)}
    else if(d.k==='endReq'){if(PL.every(q=>q.dead))over()}
  }else if(d.k==='init')onInit(d);
  else if(role==='guest'){
    if(d.k==='snap')applySnap(d);
    else if(d.k==='lvl')P.pend++;
    else if(d.k==='stun'){P.stun=d.t||.5;P.stunImm=P.stun+.8;P.fire=false;shake=Math.max(shake,6);try{navigator.vibrate&&navigator.vibrate([30,30,50])}catch(e){}}
    else if(d.k==='reviveOff'){if(from!==P.id){ovl=true;TV.pauseMenu=true;stopRevTimer()}}
    else if(d.k==='revived'){ovl=false;TV.pauseMenu=false;RVS.active=false;if(d.id===P.id){state='play';last=performance.now();cgGameplay(1)}}
    else if(d.k==='over'){state='over';online=false;role=null;ovl=false;netLeave();setTimeout(()=>endRun(d.sc,d.w),900)}
  }
}

// Сверка пуль снапшота с ghost-пулями guest. Ключ пули игрока — oid*2^32+id (id = seq*64+i).
// ack — последний выстрел guest, который host уже обработал (принял или отклонил).
//  • ghost с seq>ack — host о нём ещё не знает, остаётся лететь;
//  • авторитетная пуля с тем же ключом не рисуется отдельно: ghost остаётся единственным визуалом
//    (без скачка назад — авторитетная пуля отстаёт от ghost на время пути до host и обратно);
//  • ghost с seq<=ack без пули в снапшоте — отклонён или уже погиб на host: убираем;
//  • если траектория разошлась (рикошет на host), рисуем авторитетную пулю, ghost прячем.
function reconcileBullets(d){
  const row=(d.pl||[]).find(a=>P&&a[0]===P.id),ak=row&&row[14]!=null?row[14]|0:null;
  if(ak==null){ // host старой версии без ACK: прежнее поведение
    bl=d.bl.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3],own:!!a[4],tes:!!a[5]}));return;
  }
  const gh=new Map(),seen=new Set(),nb=[];
  for(const b of bl)if(b.pred)gh.set(b.oid*4294967296+b.id,b);
  for(const a of d.bl){
    const id=a[7]|0;
    if(id){
      const k=(a[6]|0)*4294967296+id,g=gh.get(k);
      if(g){
        seen.add(k);
        // Если ghost уже получил локальное столкновение, доверяем host-версии:
        // host мог ещё не успеть прислать тот же hit из-за round-trip latency.
        if(g.hid){
          g.ho=1;
        }else if(!g.ho&&Math.hypot(a[2]-g.vx,a[3]-g.vy)>12){
          g.hid=1;g.ho=1;
        }
        if(!g.ho)continue;
      }
    }
    nb.push({x:a[0],y:a[1],vx:a[2],vy:a[3],own:!!a[4],tes:!!a[5],oid:a[6]|0,id});
  }
  for(const [k,g] of gh)if((seen.has(k)||g.seq>ak)&&g.l>=-2)nb.push(g);
  bl=nb;
}
function applySnap(d){
  wave=d.w;score=d.sc;rest=d.rs;buffs=d.bf||{};
  const ids=new Set((d.pl||[]).map(a=>a[0]));

  if(P&&!ids.has(P.id)){netEnded('Соединение с хостом потеряно');return}
  PL.forEach((p,i)=>p.slot=i);
  for(const a of d.pl||[]){const p=PL.find(q=>q.id===a[0]);if(!p)continue;
    const wasD=p.dead;p.hp=a[5];p.max=a[6];p.dead=!!a[7];p.lvl=a[9];p.xp=a[10];p.need=a[11];
    if(p===P){if(wasD&&!p.dead){P.x=a[1];P.y=a[2]}if(!wasD&&p.dead)showBanner('ПОДБИТ','Возрождение в следующей волне')}
    else{p.tx=a[1];p.ty=a[2];p.a=a[3];p.t=a[4];p.fire=!!a[12];p.stun=a[13]?.15:0}}

    e.k=a[1];e.tx=a[2];e.ty=a[3];e.a=a[4];e.t=a[5];e.hp=a[6];e.mh=a[7];e.s=a[8];e.tick=a[9]<0?null:a[9];e.st2=a[10];e.rdx=a[11];e.rdy=a[12];e.hiveId=a[13]||0;if(e.k==14){const v=a[14]||0;e.lamp=Math.floor(v);e.lt=v-e.lamp;e.hold=a[15]||0;e.tfl=a[16]||0}e.r=e.k==12?U*.48:U*.75*e.s;e.c=TCOL[e.k][0];e.d=TCOL[e.k][1];return e});
  reconcileBullets(d);
  zn=(d.zn||[]).map(a=>({x:a[0],y:a[1],r:a[2],t:a[3],m:a[4],k:a[5],p:a[6]||0,x0:a[7]||0,y0:a[8]||0,kind:a[9]||0}));
  fires=(d.fires||[]).map(a=>({x:a[0],y:a[1],r:a[2],t:a[3],m:a[4],d:a[5],nextTick:0}));
  flames=(d.flames||[]).map(a=>({x:a[0],y:a[1],r:a[2],t:a[3],m:a[4],tx:a[5],ty:a[6],sp:a[7]||U*9}));
  pk=d.pk.map(a=>({x:a[0],y:a[1],t:a[2]==null?10:a[2]}));

  for(const f of d.fx)applyFx(f);
  for(const b of d.bn)showBanner(b[0],b[1]);
}
function applyFx(f){const x=f[0],y=f[1],c=f[2];
  if(c===1){boom(x,y,30,'#ff8a3a',U*7,.7);boom(x,y,12,'#333',U*4,1)}

    $('bs').style.display='block';
    $('rx').onclick=()=>{netLeave();onlineScreen()};
    $('ri').onclick=()=>cgCopyInvite();
    $('rs2').onclick=()=>send({t:'start'});
  }
  $('rmh').innerHTML=`<b>${esc(L.name)}</b> · Код: <b style="color:var(--acc);font-size:1.5em;letter-spacing:3px">${esc(L.code)}</b>${L.lock?' 🔒':''}`;
  $('rmn').textContent=`${t('players')}: ${L.players.length}/${L.max} (${t('minimum')} ${L.min})`+(host?'':' · '+t('waitingHost'));
  $('rml').innerHTML=L.players.map(p=>`<div class="lr" style="cursor:default"><b>${esc(p.name)}</b><span>${p.id===L.host?'👑 '+t('host'):t('player')}${p.id===net.id?' ('+t('you')+')':''}</span></div>`).join('');
  const b=$('rs2');b.style.display=host?'':'none';b.disabled=L.players.length<L.min;
  updateInviteButton();
}
$('pmo').onclick=()=>{
  if(state!=='pause')return;
  if(!wsUrl(srvAddr())){$('pmi').textContent=t('notSet');return}
  net.fromPause=true;$('pmi').textContent=t('connecting');
  netConnect((ok,m)=>{if(!ok){net.fromPause=false;$('pmi').textContent='⚠ '+m;return}send({t:'create',name:'Забег '+myName,pass:$('pmpw').value,pn:myName,tk:equip})});
};
$('pms').onclick=()=>send({t:'start'});
$('pmc').onclick=()=>{netLeave();net.fromPause=false;pmRefresh()};
requestAnimationFrame(t=>{last=t;loop(t)});
drawMenuTank();
saveReadyPromise.then(()=>{
  $('go').disabled=false;
  cgLoading(0);
  applyLocale();
  applyGate();
  try{if(state==='menu')musicPlay('menu')}catch(e){}
});
</script>
</body>
</html>
